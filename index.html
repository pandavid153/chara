<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Chara - Visual Novel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #ff6b9d; text-shadow: 2px 2px 4px #000; margin-bottom: 20px; letter-spacing: 4px; }
        .game-container {
            background: #1e1e1e;
            border: 3px solid #8b7355;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(255, 107, 157, 0.3);
            max-width: 900px;
            width: 100%;
        }
        .character-area {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }
        .character-sprite img {
            max-height: 480px;
            filter: drop-shadow(0 0 20px rgba(220, 20, 60, 0.4));
        }
        .text-box {
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #8b7355;
            padding: 25px;
            min-height: 120px;
        }
        .speaker {
            color: #ff6b9d;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .dialogue {
            color: #f0f0f0;
            font-size: 16px;
            line-height: 1.8;
            text-shadow: 1px 1px 2px #000;
        }
        .instructions {
            margin-top: 15px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>CHARA</h1>
    <div class='game-container'>
        <div class='character-area'>
            <div class='character-sprite'>
                <img src='chara.svg' alt='Chara'>
            </div>
        </div>
        <div class='text-box' id='text-box'>
            <div class='speaker'>Chara</div>
            <div class='dialogue'>* Looks up at you with crimson eyes... *</div>
            <div class='instructions'>Click to continue...</div>
        </div>
    </div>
    <script>
        let lines = [
            { speaker: 'Chara', text: '* Looks up at you with crimson eyes... *' },
            { speaker: 'Chara', text: '* Smiles softly. * My name is Chara.' },
            { speaker: 'Chara', text: '* Adjusts her red and green striped shirt. * I hope we can get along.' },
            { speaker: 'Chara', text: '* Tilts her shoulder length brown hair. * Shall we begin our story?' },
            { speaker: 'Chara', text: '* Grins mischievously. * Let\'s make this fun, okay?' }
        ];
        let current = 0;
        document.getElementById('text-box').addEventListener('click', () => {
            current = (current + 1) % lines.length;
            document.querySelector('.speaker').textContent = lines[current].speaker;
            document.querySelector('.dialogue').textContent = lines[current].text;
        });
    </script>
</body>
</html>
